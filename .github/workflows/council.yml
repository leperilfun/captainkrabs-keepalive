name: CaptainKrabs Council Check (Manual — Decisions via Antigravity Bridge)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: captainkrabs-council
  cancel-in-progress: true

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout script
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Strategist Lock Status (0 External LLM API)
        env:
          CK_RENDER_URL: ${{ secrets.CK_RENDER_URL }}
          DAEMON_API_KEY: ${{ secrets.DAEMON_API_KEY }}
          DAEMON_SIGNING_KEY: ${{ secrets.DAEMON_SIGNING_KEY }}
        run: node scripts/council-strategist.mjs
